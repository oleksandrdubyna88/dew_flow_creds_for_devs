name: ci · extension

# Pipeline 1 of 3. The VS Code extension, on its own, so a change to the .NET
# server never blocks it and its failures are never mixed into someone else's log.
#
# Path-filtered: a commit that touches only the server or the docs does not run
# this at all, rather than running it to say nothing changed.
on:
  push:
    branches: [main]
    paths:
      - 'src_vs_code/**'
      - '.github/workflows/ci-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src_vs_code/**'
      - '.github/workflows/ci-extension.yml'
  workflow_dispatch:

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck · test · package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The size/complexity boundaries (max-lines 800, max-lines-per-function 50,
      # complexity 4, no-console) — pre-existing debt carries explicit eslint-disable
      # markers, so THIS step failing means a NEW violation.
      - name: Lint
        run: npm run lint

      # node:test over the compiled out/. Every module that needs a unit test is
      # written free of `vscode`, which is why no VS Code test harness is needed.
      - name: Test
        run: npm test

      # Drives the REAL broker over real HTTP and spawns the real CLI as a subprocess — the
      # only check that exercises the loopback surface end to end, and self-contained, so it
      # belongs here. It ran nowhere until now, which is how two defects reached released
      # builds and stayed: a denied grant answering "unknown token", and a key-file assertion
      # that could never fail because it looked in the wrong directory. A test outside CI is
      # a document, not a test.
      #
      # `npm run itest:server` is deliberately NOT here: it drives ServerTransport against a
      # Cred Vault Server the operator starts by hand (see the header of
      # scripts/server-transport-itest.cjs). Adding it would mean building and running the
      # .NET server in this workflow; until someone does that, it stays a manual check rather
      # than a step that fails for the wrong reason.
      - name: Integration test (agent broker)
        run: npm run itest:agent

      # Packaging proves the manifest is publishable: a missing icon, licence or
      # repository field fails here rather than at `vsce publish` time.
      - name: Package
        run: npx vsce package --out creds-for-devs-ci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: src_vs_code/creds-for-devs-ci.vsix
          retention-days: 14

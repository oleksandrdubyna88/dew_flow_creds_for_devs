name: ci · extension

# Pipeline 1 of 3. The VS Code extension, on its own, so a change to the .NET
# server never blocks it and its failures are never mixed into someone else's log.
#
# Path-filtered: a commit that touches only the server or the docs does not run
# this at all, rather than running it to say nothing changed.
on:
  push:
    branches: [main]
    paths:
      - 'src_vs_code/**'
      - '.github/workflows/ci-extension.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck · test · package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The size/complexity boundaries (max-lines 800, max-lines-per-function 50,
      # complexity 4, no-console) — pre-existing debt carries explicit eslint-disable
      # markers, so THIS step failing means a NEW violation.
      - name: Lint
        run: npm run lint

      # The size ratchet (tails T3): the two files exempted from the 800-line ceiling may
      # shrink, never grow. .size-baseline.json is the number; `npm run ratchet -- --update`
      # is the only way it moves, and only downward.
      # `npm run ratchet` compiles first: the script imports the decision from out/, which
      # does not exist on a fresh runner — the first CI run of this step found exactly that.
      - name: Size ratchet
        run: npm run ratchet

      # node:test over the compiled out/. Every module that needs a unit test is
      # written free of `vscode`, which is why no VS Code test harness is needed.
      - name: Test
        run: npm test

      # Drives the REAL broker over real HTTP and spawns the real CLI as a subprocess — the
      # only check that exercises the loopback surface end to end, and self-contained, so it
      # belongs here. It ran nowhere until now, which is how two defects reached released
      # builds and stayed: a denied grant answering "unknown token", and a key-file assertion
      # that could never fail because it looked in the wrong directory. A test outside CI is
      # a document, not a test.
      #
      # `npm run itest:server` is deliberately NOT here: it drives ServerTransport against a
      # Cred Vault Server the operator starts by hand (see the header of
      # scripts/server-transport-itest.cjs). Adding it would mean building and running the
      # .NET server in this workflow; until someone does that, it stays a manual check rather
      # than a step that fails for the wrong reason.
      - name: Integration test (agent broker)
        run: npm run itest:agent

      # Drives the real GitTransport against a real `git init --bare` in a temp directory —
      # no network, no hosting account, but genuinely git. It caught the one defect the unit
      # tests structurally could not: on Windows git rewrites line endings on checkout, so a
      # vault written on one machine came back with different bytes on another.
      - name: Integration test (git transport)
        run: npm run itest:git

      # Drives the REAL .NET `creds` binary against a REAL broker. The contract tests on each
      # side assert that the two implementations' tables agree; neither asserts that the binary
      # can talk to the broker at all, and until this existed none ever had. It found a shipped
      # defect on its first run: `/v1/use/exportEnv` was unreachable, so the `env` verb had
      # never worked from any client. Needs the .NET SDK; the script SKIPS rather than fails
      # when the CLI is not built, so this stays honest on a machine without one.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the CLI
        run: dotnet build ../src_cli/src/CredsCli.csproj

      - name: Integration test (creds CLI against the broker)
        run: npm run itest:cli

      # The MCP surface end to end: `creds-mcp` over stdio, every tool, and both switch ladders
      # including the `own` delete scope. It was run by whoever remembered it until 2026-09-06,
      # which is the state `scenario-tests.md` was written about — and the same day, the WSL
      # relay harness turned out to have been unable to START for long enough that nobody could
      # say when. Nothing platform-specific here beyond the binary's name, so it runs on the
      # Ubuntu runner beside the CLI. Catalogued in research/module_tests.md.
      - name: Build the MCP server
        run: dotnet build ../src_mcp/src/CredsMcp.csproj

      - name: Integration test (creds-mcp over stdio)
        run: npm run itest:mcp

      # A masked run through a real pty: the value reaches the child's environment and every
      # appearance of it in the child's OUTPUT becomes a placeholder. Both platform branches are
      # written, so the Linux one is what CI exercises.
      - name: Integration test (masked run)
        run: npm run itest:masked-run

      # The backup archive end to end through the REAL server binary: seal a tree, verify it, open
      # it somewhere else, compare every file byte for byte, and then damage the archive in each of
      # the ways that must be refused. The unit suite drives the same code in-process, which says
      # nothing about whether the shipped entry point wired the verbs up at all - the exact shape of
      # failure this family has already had once. It found its own version of that on its first run:
      # a published binary from an earlier build, silently under test.
      - name: Build the server
        run: dotnet build ../src_minimalapi_server/src/CredVaultServer.csproj

      - name: Integration test (backup archive through the server binary)
        run: npm run itest:backup-archive

      # Packaging proves the manifest is publishable: a missing icon, licence or
      # repository field fails here rather than at `vsce publish` time.
      - name: Package
        run: npx vsce package --out creds-for-devs-ci.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: src_vs_code/creds-for-devs-ci.vsix
          retention-days: 14

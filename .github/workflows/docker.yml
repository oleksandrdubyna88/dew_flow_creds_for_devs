name: docker image

# Pipeline 3 of 3. Only ever runs after `ci · server` has gone green — an image is
# not worth building from code whose tests have not passed, and it is certainly not
# worth publishing.
#
# `workflow_run` is what chains one workflow to another. Two consequences it is easy
# to get wrong, and both are handled below:
#   1. The event fires on completion regardless of outcome, so the job must check
#      `conclusion == 'success'` itself.
#   2. It runs in the context of the DEFAULT BRANCH, not the commit that triggered
#      it — so the checkout must name `head_sha` explicitly, or this would build
#      main's tip while claiming to build the commit that passed.
on:
  workflow_run:
    workflows: ["ci · server"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: build · smoke · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failed or cancelled server pipeline produces no image.
    # Only a PUSH to main builds and publishes. `ci · server` also runs for pull requests, and a
    # workflow_run chained to it would otherwise check out a pull request's head — from a fork,
    # potentially — with packages:write in hand and build it into a published image (CodeQL
    # actions/untrusted-checkout, 2026-09-05). A pull request is tested by its own workflows;
    # nothing it contains is published until it is merged and pushed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the commit that actually passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # This job holds packages:write, so the token has no business staying in the local git
          # config where the checked-out build could reach it. The if: above already bounds WHAT is
          # checked out to a push on main; this bounds what it could do with what it finds.
          persist-credentials: false

      # common/test-leftovers.md §1, §3, §5: one random id per job; the owner segment of every name is the runner user's uid,
      # written as a literal (`u1001`, the uid of the hosted ubuntu-latest runner, the only runner this workflow runs on). The
      # FIRST command checks that uid, so on any other runner the job fails here with no image, container or volume made.
      # The record's pid is the job's runner worker, the parent of every step's shell: the only process that outlives a step.
      # It is printed once, so the first run shows which process that is.
      - name: Name the smoke's resources
        run: |
          [ "$(id -u)" = 1001 ] || exit 1
          echo "runner uid: $(id -u)"
          {
            echo "SMOKE_ID=$(openssl rand -hex 4)"
            echo "SMOKE_OWNER=u1001:$(hostname | sed -E 's/[@:[:space:]]+/-/g')@linux:$PPID"
          } >> "$GITHUB_ENV"
          ps -o pid=,comm= -p "$PPID" || true

      # Pinned to SHAs, not tags: a tag can be repointed at any commit by whoever owns the action,
      # and every workflow naming it follows silently. The version comment is what keeps the line
      # readable. (SonarCloud githubactions:S7637; the conventions repository pinned its own Sonar
      # action the same way. `actions/*` is GitHub’s own and is not raised.)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once, locally, and smoke-test THAT image. The publish step below reuses
      # this build's cache, so what reaches the registry is what was tested.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: false
          load: true
          tags: cred-vault-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds but does not serve is not a green build. The container is named under the leftovers
      # contract and has no --rm: its logs are what a failed health wait prints. The remover below takes it out on every path.
      - name: Smoke-test
        run: |
          docker run -d --name "testsToDelete-u1001-creds-cv-${SMOKE_ID}" \
            --label "testsToDelete.owner=$SMOKE_OWNER" \
            -e Vault__AllowedDomains=example.com \
            -e Auth__Local__SigningKey=ci-signing-key-ci-signing-key-32b \
            -p 8080:8080 cred-vault-server:ci
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "testsToDelete-u1001-creds-cv-${SMOKE_ID}" 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs "testsToDelete-u1001-creds-cv-${SMOKE_ID}"; exit 1; }
            sleep 2
          done
          [ "$state" = "healthy" ] || { echo "never became healthy"; docker logs "testsToDelete-u1001-creds-cv-${SMOKE_ID}"; exit 1; }
          curl --fail --silent http://127.0.0.1:8080/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/vault)
          [ "$code" = "401" ] || { echo "unauthenticated vault access returned $code, expected 401"; exit 1; }

      # A start the server REFUSES must say why in its per-run log file and exit 78 (EX_CONFIG) — not die
      # with the runtime's crash code. Measured on 0.11.0 before the fix: exit 139 under Native AOT and a
      # file without the reason (research/PLAN_server_startup_refusal_is_logged.md). The JIT build's
      # process test cannot see the AOT binary, so this is the recurring check that the published shape
      # still does it: read-only root, tmpfs /tmp, no capabilities, no-new-privileges, Docker VOLUMES.
      - name: Smoke-test a refused start
        run: |
          docker volume create --label "testsToDelete.owner=$SMOKE_OWNER" "testsToDelete-u1001-creds-refused-data-${SMOKE_ID}"
          docker volume create --label "testsToDelete.owner=$SMOKE_OWNER" "testsToDelete-u1001-creds-refused-logs-${SMOKE_ID}"
          # Detached and waited for with a bound: a regression that made this configuration START would
          # otherwise keep `docker run` in the foreground forever and hang the job instead of failing it.
          docker run -d --name "testsToDelete-u1001-creds-refused-${SMOKE_ID}" --read-only --tmpfs /tmp --cap-drop ALL \
            --label "testsToDelete.owner=$SMOKE_OWNER" \
            --security-opt no-new-privileges \
            -v "testsToDelete-u1001-creds-refused-data-${SMOKE_ID}:/data" -v "testsToDelete-u1001-creds-refused-logs-${SMOKE_ID}:/logs" \
            -e Vault__AllowedDomains=example.com \
            cred-vault-server:ci
          code=$(timeout 120 docker wait "testsToDelete-u1001-creds-refused-${SMOKE_ID}") \
            || { echo "a refused start was still running after 120 s"; docker logs "testsToDelete-u1001-creds-refused-${SMOKE_ID}"; exit 1; }
          [ "$code" = "78" ] || { echo "a refused start exited $code, expected 78"; docker logs "testsToDelete-u1001-creds-refused-${SMOKE_ID}"; exit 1; }
          docker cp "testsToDelete-u1001-creds-refused-${SMOKE_ID}:/logs" ./refused-logs
          grep -rF "FTL]" ./refused-logs | grep -F "exited: code 78, reason startupRefused: No authentication scheme configured" \
            || { echo "the refusal is not in the run's log file:"; find ./refused-logs -type f -exec cat {} +; exit 1; }

      # The carve-out's remover (common/test-leftovers.md section 5): after the last step that reads the two containers,
      # on every path, by exact name. It never decides the verdict: continue-on-error, `|| true`, nothing here fails the job.
      # `shell: bash` makes the body run as `bash --noprofile --norc -eo pipefail`: without `|| true` the first failed removal
      # would end the step and the later ones would not run. The names stay unquoted, because the guard reads this raw text.
      - name: Remove the smoke's containers and volumes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # SMOKE_ID is 8 hex digits and the guard reads a remover's names only when they are unquoted, so each of the four
          # removals carries the directive: actionlint puts `set -eo pipefail` first, and a directive reaches ONE command.
          [ -n "${SMOKE_ID:-}" ] || { echo "no smoke id: nothing was named, nothing to remove"; exit 0; }
          # shellcheck disable=SC2086 # unquoted on purpose: SMOKE_ID is 8 hex digits
          docker rm -f -v testsToDelete-u1001-creds-cv-${SMOKE_ID} || true
          # shellcheck disable=SC2086 # unquoted on purpose: SMOKE_ID is 8 hex digits
          docker rm -f -v testsToDelete-u1001-creds-refused-${SMOKE_ID} || true
          # shellcheck disable=SC2086 # unquoted on purpose: SMOKE_ID is 8 hex digits
          docker volume rm testsToDelete-u1001-creds-refused-data-${SMOKE_ID} || true
          # shellcheck disable=SC2086 # unquoted on purpose: SMOKE_ID is 8 hex digits
          docker volume rm testsToDelete-u1001-creds-refused-logs-${SMOKE_ID} || true
          echo "left after removal:"
          docker ps -a --filter label=testsToDelete.owner --format '{{.Names}}' || true
          docker volume ls --filter label=testsToDelete.owner --format '{{.Name}}' || true

      # Nothing of the smoke is left, or the job is red. No continue-on-error: this step can only turn the job red, never
      # green, and `Publish` (implicit success()) is then skipped. Filters only, never a reader verb after the remover, and
      # each name a literal, so a reader added here is a guard finding.
      - name: Check that nothing of the smoke is left
        if: always()
        shell: bash
        run: |
          [ -n "${SMOKE_ID:-}" ] || exit 0
          left=""
          [ -z "$(docker ps -a -q --filter "name=^testsToDelete-u1001-creds-cv-${SMOKE_ID}$")" ] || left="$left cv"
          [ -z "$(docker ps -a -q --filter "name=^testsToDelete-u1001-creds-refused-${SMOKE_ID}$")" ] || left="$left refused"
          [ -z "$(docker volume ls -q --filter "name=^testsToDelete-u1001-creds-refused-data-${SMOKE_ID}$")" ] || left="$left refused-data"
          [ -z "$(docker volume ls -q --filter "name=^testsToDelete-u1001-creds-refused-logs-${SMOKE_ID}$")" ] || left="$left refused-logs"
          [ -z "$left" ] || { echo "left after removal:$left"; exit 1; }

      # ---------------------------------------------------------------------
      # Publish, but only for main. A pull request must never be able to move a
      # tag an operator might be pulling.
      #
      # ghcr.io is GitHub's own container registry: no second account, no second
      # credential, and GITHUB_TOKEN already carries `packages: write`. `:edge`
      # tracks main; `:latest` moves only on a `server-v*` tag from release.yml,
      # so pinning `:latest` never picks up an untagged commit.
      # ---------------------------------------------------------------------
      - name: Log in to ghcr.io
        if: github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: true
          # linux/arm64 covers the small ARM VPS this is likely to live on.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:edge
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/cred-vault-server:edge"
            echo "ghcr.io/${{ github.repository_owner }}/cred-vault-server:sha-${{ github.event.workflow_run.head_sha || github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: docker image

# Pipeline 3 of 3. Only ever runs after `ci · server` has gone green — an image is
# not worth building from code whose tests have not passed, and it is certainly not
# worth publishing.
#
# `workflow_run` is what chains one workflow to another. Two consequences it is easy
# to get wrong, and both are handled below:
#   1. The event fires on completion regardless of outcome, so the job must check
#      `conclusion == 'success'` itself.
#   2. It runs in the context of the DEFAULT BRANCH, not the commit that triggered
#      it — so the checkout must name `head_sha` explicitly, or this would build
#      main's tip while claiming to build the commit that passed.
on:
  workflow_run:
    workflows: ["ci · server"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: build · smoke · publish
    runs-on: ubuntu-latest
    # A failed or cancelled server pipeline produces no image.
    # Only a PUSH to main builds and publishes. `ci · server` also runs for pull requests, and a
    # workflow_run chained to it would otherwise check out a pull request's head — from a fork,
    # potentially — with packages:write in hand and build it into a published image (CodeQL
    # actions/untrusted-checkout, 2026-09-05). A pull request is tested by its own workflows;
    # nothing it contains is published until it is merged and pushed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit that actually passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # This job holds packages:write, so the token has no business staying in the local git
          # config where the checked-out build could reach it. The if: above already bounds WHAT is
          # checked out to a push on main; this bounds what it could do with what it finds.
          persist-credentials: false

      # Pinned to SHAs, not tags: a tag can be repointed at any commit by whoever owns the action,
      # and every workflow naming it follows silently. The version comment is what keeps the line
      # readable. (SonarCloud githubactions:S7637; the conventions repository pinned its own Sonar
      # action the same way. `actions/*` is GitHub’s own and is not raised.)
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build once, locally, and smoke-test THAT image. The publish step below reuses
      # this build's cache, so what reaches the registry is what was tested.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: false
          load: true
          tags: cred-vault-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds but does not serve is not a green build.
      - name: Smoke-test
        run: |
          docker run -d --name cv \
            -e Vault__AllowedDomains=example.com \
            -e Auth__Local__SigningKey=ci-signing-key-ci-signing-key-32b \
            -p 8080:8080 cred-vault-server:ci
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' cv 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs cv; exit 1; }
            sleep 2
          done
          [ "$state" = "healthy" ] || { echo "never became healthy"; docker logs cv; exit 1; }
          curl --fail --silent http://127.0.0.1:8080/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/vault)
          [ "$code" = "401" ] || { echo "unauthenticated vault access returned $code, expected 401"; exit 1; }
          docker rm -f cv

      # ---------------------------------------------------------------------
      # Publish, but only for main. A pull request must never be able to move a
      # tag an operator might be pulling.
      #
      # ghcr.io is GitHub's own container registry: no second account, no second
      # credential, and GITHUB_TOKEN already carries `packages: write`. `:edge`
      # tracks main; `:latest` moves only on a `server-v*` tag from release.yml,
      # so pinning `:latest` never picks up an untagged commit.
      # ---------------------------------------------------------------------
      - name: Log in to ghcr.io
        if: github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: true
          # linux/arm64 covers the small ARM VPS this is likely to live on.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:edge
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/cred-vault-server:edge"
            echo "ghcr.io/${{ github.repository_owner }}/cred-vault-server:sha-${{ github.event.workflow_run.head_sha || github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

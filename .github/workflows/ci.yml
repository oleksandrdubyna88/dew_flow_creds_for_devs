name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The .NET minimal API. Independent of the extension job by design: a change to
  # one product must never be blocked by the other's toolchain.
  # ---------------------------------------------------------------------------
  server:
    name: server (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build dew_flow_creds_for_devs.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a
      # self-contained runner executable. `dotnet test` has no VSTest host here and
      # would abort — never use it (.claude/rules/shared/common/testing.md).
      # No `.exe` suffix on Linux; the same binary is CredVaultServer.Tests.exe locally.
      - name: Test
        run: ./src_minimalapi_server/tests/bin/Release/net10.0/CredVaultServer.Tests

  # ---------------------------------------------------------------------------
  # The VS Code extension.
  # ---------------------------------------------------------------------------
  extension:
    name: extension (VS Code)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the manifest is publishable — a missing icon, license or repository
      # field fails here rather than at `vsce publish` time.
      - name: Package
        run: npx vsce package --out cred-ssh-manager-ci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: src_vs_code/cred-ssh-manager-ci.vsix
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The deployment artefact. Built on every change so a broken Dockerfile is caught
  # here and not by an operator at 02:00.
  # ---------------------------------------------------------------------------
  docker:
    name: server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, locally, and smoke-test THAT image. Publishing below re-uses the
      # same build cache, so what gets pushed is what was tested.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: false
          load: true
          tags: cred-vault-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds but does not serve is not a green build.
      - name: Smoke-test the image
        run: |
          docker run -d --name cv \
            -e Vault__AllowedDomains=example.com \
            -e Auth__Local__SigningKey=ci-signing-key-ci-signing-key-32b \
            -p 8080:8080 cred-vault-server:ci
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' cv 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs cv; exit 1; }
            sleep 2
          done
          [ "$state" = "healthy" ] || { echo "never became healthy"; docker logs cv; exit 1; }
          curl --fail --silent http://127.0.0.1:8080/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/vault)
          [ "$code" = "401" ] || { echo "unauthenticated vault access returned $code, expected 401"; exit 1; }
          docker rm -f cv

      - name: Validate the deployment stack
        working-directory: deploy
        run: |
          cp .env.example .env
          for mode in domain ip custom none; do
            sed -i "s/^TLS_MODE=.*/TLS_MODE=$mode/" .env
            docker compose config >/dev/null || { echo "compose invalid for TLS_MODE=$mode"; exit 1; }
          done
          rm .env

      - name: Shell-check the operator scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck deploy/update.sh deploy/backup.sh
          # The container entrypoints are POSIX sh, not bash.
          shellcheck --shell=sh deploy/nginx/entrypoint.sh deploy/certbot/entrypoint.sh

      # ---------------------------------------------------------------------
      # Publish the tested image, but only from main — a pull request must never
      # be able to move a tag an operator might be pulling.
      #
      # ghcr.io is GitHub's own container registry: no second account, no second
      # credential, and GITHUB_TOKEN already has the rights. `:edge` tracks main;
      # a real version tag comes from release.yml, and `:latest` moves only there,
      # so pinning `:latest` never picks up an untagged commit.
      # ---------------------------------------------------------------------
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish edge image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:edge
            ghcr.io/${{ github.repository_owner }}/cred-vault-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # The plan lifecycle, enforced from the shared rules repository rather than once
  # per consumer — the check reads markdown, not code. Only that ONE submodule is
  # fetched: `submodules: true` would drag in every other one for a markdown walk.
  # ---------------------------------------------------------------------------
  plans:
    name: docs + plan lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the shared rules
        run: git submodule update --init --depth 1 .claude/rules/shared

      - name: Plan lifecycle
        run: node .claude/rules/shared/tools/plan-lifecycle.mjs

      # Every submodule pin must equal its remote's tip — "a rule change and the pin
      # bumps are one task" is a check, not a habit.
      - name: Pin check
        run: node .claude/rules/shared/tools/pin-check.mjs

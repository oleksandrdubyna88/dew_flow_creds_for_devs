name: rsd server deploy

# Manual-only deployment of the vault stack to the RSD server.
#
# Safety model for a PUBLIC repository, stated where the next reader looks:
#   - Only people with WRITE access to this repo can press Run. A fork never can,
#     and workflows from fork PRs never receive secrets — that is GitHub's rule,
#     not ours.
#   - Everything identifying the server (host, user, path, key, host key) lives in
#     Actions SECRETS: encrypted at rest, never in the repo, and MASKED in the run
#     logs — which matters because on a public repo the logs are public too.
#   - The SSH host key is pinned from a secret, not accept-new: a hijacked DNS
#     record gets a refusal, not our deploy credentials.
#   - The remote command is fixed here. The one thing an operator chooses is the
#     version, and that is handed to update.sh, which pulls first, waits for
#     healthy, and prints the rollback command if the new container is not.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Server version to deploy (e.g. 0.2.1), or "rollback"'
        required: true
        type: string
      pull_deploy_folder:
        description: 'git pull the deploy/ folder first (compose/nginx changes)'
        type: boolean
        default: true

# Two deploys racing would interleave update.sh's state file. One at a time, no queue-jumping.
concurrency:
  group: rsd-server-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rsd-server
    steps:
      - name: Refuse to run without the secrets
        env:
          HOST: ${{ secrets.RSD_SSH_HOST }}
          KEY: ${{ secrets.RSD_SSH_KEY }}
          KNOWN: ${{ secrets.RSD_KNOWN_HOSTS }}
        run: |
          for pair in "RSD_SSH_HOST:$HOST" "RSD_SSH_KEY:$KEY" "RSD_KNOWN_HOSTS:$KNOWN"; do
            if [ -z "${pair#*:}" ]; then
              echo "Secret ${pair%%:*} is not set — see the header of this workflow file."
              exit 1
            fi
          done

      - name: SSH key and pinned host key
        env:
          KEY: ${{ secrets.RSD_SSH_KEY }}
          KNOWN: ${{ secrets.RSD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.RSD_SSH_HOST }}
          SSH_USER: ${{ secrets.RSD_SSH_USER }}
          VERSION: ${{ inputs.version }}
          PULL: ${{ inputs.pull_deploy_folder }}
        # The key on the server carries restrict,command=: whatever is sent here lands in
        # SSH_ORIGINAL_COMMAND of a validating wrapper that accepts exactly
        # `deploy <version>` / `deploy --rollback` (+ optional `nopull`) and nothing else.
        # A leaked key is an update button, not root. The path lives server-side now.
        run: |
          ARG="$VERSION"
          [ "$VERSION" = "rollback" ] && ARG="--rollback"
          CMD="deploy $ARG"
          [ "$PULL" = "true" ] || CMD="$CMD nopull"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes               "${SSH_USER:-root}@$HOST" "$CMD"

      # A 200 on /api/health says the process is alive. It does not say the certificate has more
      # than a fortnight left, that the plaintext port redirects, that the running build is the one
      # just deployed, or that the scope a client needs is configured — and every one of those is
      # decided by this host rather than by the code, which is what POST_DEPLOY.md is a list of.
      - name: Wait for the deployment to answer
        env:
          URL: ${{ secrets.RSD_PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RSD_PUBLIC_URL not set — skipping the external probe."
            exit 0
          fi
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$URL/api/health" || true)
            [ "$code" = "200" ] && { echo "healthy from the internet"; exit 0; }
            sleep 5
          done
          echo "the server did not answer 200 on /api/health from outside"; exit 1

      # This workflow is otherwise pure SSH and checks nothing out. The checklist and its runner
      # live in the repository, so it needs them — and only from here down.
      - uses: actions/checkout@v7
      - run: git submodule update --init --depth 1 .claude/rules/shared

      - name: Run the post-deploy checklist against what is now running
        env:
          URL: ${{ secrets.RSD_PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RSD_PUBLIC_URL not set — the checklist has no target to run against."
            exit 0
          fi
          node .claude/rules/shared/tools/post-deploy-check.mjs --target "$URL"

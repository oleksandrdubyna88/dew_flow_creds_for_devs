name: release

# Four products, four tag shapes, so releasing one never ships the others:
#   server-v1.2.3     -> builds and pushes the container image
#   extension-v0.24.0 -> packages and publishes to the VS Code Marketplace
#   cli-v0.1.0        -> four Native AOT `creds` binaries, attached to the release
#   mcp-v0.1.0        -> four Native AOT `creds-mcp` binaries, attached to the release
#
# The `cli-v*` line was missing while the `cli-binaries` job below was complete and
# guarded by `if: startsWith(github.ref, 'refs/tags/cli-v')` — so the job existed, was
# correct, and could never run. Found by pushing the first cli tag and watching nothing
# happen. A guard on a job is not a trigger for the workflow.
on:
  push:
    tags:
      - 'server-v*'
      - 'extension-v*'
      - 'cli-v*'
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to release'
        required: true
        type: choice
        options: [server, extension, cli, mcp]

permissions:
  contents: read

jobs:
  # Native AOT does not cross-compile under qemu, so each architecture builds on a
  # runner of that architecture and a manifest job stitches the two digests together.
  server-image:
    name: server image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/server-v') || inputs.target == 'server'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-manual" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src_minimalapi_server/Dockerfile
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cred-vault-server
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  server-manifest:
    name: publish server manifest
    needs: server-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cred-vault-server
          VERSION="${GITHUB_REF_NAME#server-v}"
          TAGS=(-t "$IMAGE:$VERSION")
          # `latest` moves only on a real tag, so an operator who pinned :latest never
          # picks up a workflow_dispatch trial build.
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            TAGS+=(-t "$IMAGE:latest")
          else
            TAGS=(-t "$IMAGE:manual-$(date +%Y%m%d%H%M 2>/dev/null || echo run)")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE@${{ needs.server-image.outputs.digest-amd64 }}" "$IMAGE@${{ needs.server-image.outputs.digest-arm64 }}"

  # Standalone Native AOT binaries, one per OS/architecture, attached to the release.
  # Each builds on a machine of its own kind — AOT links with the host toolchain.
  server-binaries:
    name: server binary (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/server-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # macOS needs no toolchain step: Native AOT uses the Xcode command line tools the
          # runners already carry. It cannot be cross-compiled, which is why each of these is
          # its OWN runner rather than another `-r` on an existing one.
          - rid: osx-arm64
            runner: macos-latest
          # osx-x64 built on the arm64 image, cross-targeted. It used to say `macos-13`, the last
          # Intel image, and that is why every server release ever made is missing this one asset:
          # the leg did not fail, it QUEUED — for 45 minutes on the tag that finally got looked at,
          # and presumably forever on the ones before. A job waiting for a runner that is not coming
          # is invisible in every list that shows conclusions.
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # attach binaries to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        shell: bash
        run: dotnet publish src_minimalapi_server/src/CredVaultServer.csproj -c Release -r ${{ matrix.rid }} -o out -p:Version="${GITHUB_REF_NAME#server-v}"

      - name: Package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          NAME="cred-vault-server-$VERSION-$RID"
          mkdir "$NAME"
          if [[ "$RID" == win-* ]]; then
            cp out/CredVaultServer.exe "$NAME/"
            cp src_minimalapi_server/src/appsettings.json "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            cp out/CredVaultServer "$NAME/"
            cp src_minimalapi_server/src/appsettings.json "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      # The leg hands its asset to the publish job and does NOT touch the release. See the comment on
      # `server-release` for what that changed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.rid }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  # ONE publish, after the WHOLE matrix — the rule from
  # .claude/rules/shared/common/development-workflow.md, applied here because this workflow was the
  # thing it warns about. Every leg used to run `gh release create … || true` and upload its own
  # asset, so the release went public the moment the FIRST leg finished and every later one added to
  # it. A leg that failed, or sat queued on a retired runner image, therefore left a PUBLISHED release
  # with a partial asset set and nothing anywhere reporting a problem.
  #
  # That is not hypothetical here: server-v0.5.0 shipped 4 assets, v0.5.1 shipped 5, v0.5.2 shipped 5
  # — every server release this repository has ever made was missing osx-x64, and each one read as a
  # success in every list. `needs:` makes a single failed leg keep the release from being PUBLISHED at
  # all, and the count assertion below makes a silently shrinking matrix a red build rather than an
  # absence a user discovers on the download page.
  #
  # SINCE 2026-09-21 THE RELEASE IS NOT CREATED HERE — release-please creates it when it cuts the tag,
  # which is how it cuts one. The guarantee is unchanged and the mechanism moved by one word: it makes
  # a DRAFT, this job uploads onto it, the assertion runs against the real release, and the last step
  # flips the draft off. A failure anywhere leaves a draft, which is invisible rather than misleading.
  # `draft: true` in release-please-config.json is the other half, and it is not optional: without it
  # `gh release create` fails outright and the release sits PUBLISHED AND EMPTY. That is not a guess —
  # server-v0.8.0 and cli-v0.2.0 did exactly that.
  server-release:
    name: publish server release
    needs: server-binaries
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*
          path: assets
          merge-multiple: true

      - name: Every asset onto the draft release at once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#server-v}"
          # UPLOAD, not create: release-please already made this release when it cut the tag, as a
          # DRAFT nobody can download. Creating it again fails with "a release with the same tag name
          # already exists" — which is how this was found, with two releases already public and empty.
          # The draft is flipped off in the step after the asset assertion, so the guarantee this job
          # was built for survives: nothing is downloadable until every target has an asset.
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          # release-please's notes are the generated changelog, which says more than the sentence
          # that used to be here — so they are KEPT and the coordinate is appended to them.
          #
          # APPENDED ONCE, however often this runs. Re-running a release job is ordinary (a flaky
          # upload, a retried leg), and an append that does not check would leave the same paragraph
          # twice, then three times. The body is read back and tested for the line before adding it.
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          # shellcheck disable=SC2016  # the backticks are MARKDOWN, wanted literal; the values come
          # through %s precisely so the string never has to expand anything.
          COORD="$(printf 'Native AOT builds. Docker: `ghcr.io/%s/cred-vault-server:%s`' "$OWNER" "$VERSION")"
          case "$BODY" in
            *"$COORD"*) printf '%s\n' "$BODY" > notes.md ;;
            *)          { printf '%s' "$BODY"; printf '\n\n%s\n' "$COORD"; } > notes.md ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --title "cred-vault-server $VERSION" --notes-file notes.md

      # Asserted from the RELEASE, not from this workflow's opinion of itself: a matrix that silently
      # shrinks — a runner image retired, a leg skipped by an `if:` — passes every job-level check.
      - name: Every target has an asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RIDS: linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64 osx-x64
        shell: bash
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          MISSING=""
          for rid in $EXPECTED_RIDS; do
            case "$NAMES" in *"$rid"*) ;; *) MISSING="$MISSING $rid" ;; esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the release is missing an asset for:$MISSING"
            echo "A user on that platform finds an absence, not an error. Delete the release and the"
            echo "tag, fix the leg, and ship the next patch version — never move a tag."
            exit 1
          fi
          echo "all six RIDs present: $NAMES"

      # ONLY NOW does it become downloadable. This is the step that carries the guarantee the job
      # above was built for: release-please cut the tag and left a draft, the assets went on, the
      # assertion passed against the REAL release, and publishing is the last thing that happens.
      # A failure anywhere above leaves a draft, which is invisible rather than misleading.
      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # The headless CLI, same technology and same four RIDs as the server: one toolchain in the
  # repository, and the AOT analyzers already run on every ordinary build so an incompatible
  # pattern fails at compile time rather than here. Tagged separately (cli-v*) because the CLI
  # and the server version independently.
  cli-binaries:
    name: creds cli (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/cli-v') || inputs.target == 'cli'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # macOS needs no toolchain step: Native AOT uses the Xcode command line tools the
          # runners already carry. It cannot be cross-compiled, which is why each of these is
          # its OWN runner rather than another `-r` on an existing one.
          - rid: osx-arm64
            runner: macos-latest
          # osx-x64 built on the arm64 image, cross-targeted. It used to say `macos-13`, the last
          # Intel image, and that is why every server release ever made is missing this one asset:
          # the leg did not fail, it QUEUED — for 45 minutes on the tag that finally got looked at,
          # and presumably forever on the ones before. A job waiting for a runner that is not coming
          # is invisible in every list that shows conclusions.
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Never ship a binary that has not passed its own tests — and these include the contract
      # check that stops this implementation drifting from the extension's.
      #
      # Two suites since the broker client became a library shared with `creds-mcp`: the
      # library's own tests assert what the CONTRACT says, and the CLI's assert that THIS
      # binary's verbs and exit codes are all in it. Building the CLI compiles the library but
      # runs none of its tests, which is exactly the gap a shared component is prone to.
      - name: Test
        run: |
          dotnet build src_broker_client/tests/BrokerClient.Tests.csproj -c Release
          ./src_broker_client/tests/bin/Release/net10.0/CredsBroker.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          dotnet build src_cli/tests/CredsCli.Tests.csproj -c Release
          ./src_cli/tests/bin/Release/net10.0/CredsCli.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash

      - name: Publish
        run: dotnet publish src_cli/src/CredsCli.csproj -c Release -r ${{ matrix.rid }} -o out

      # A binary that cannot answer --help did not really build; AOT failures often surface
      # only at first run. Skipped when cross-architecture, where the runner cannot execute it.
      - name: Smoke
        if: ${{ !endsWith(matrix.rid, 'arm64') }}
        shell: bash
        run: ./out/creds${{ runner.os == 'Windows' && '.exe' || '' }} --help | grep -q 'creds ssh'

      - name: Package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          NAME="creds-$VERSION-$RID"
          mkdir "$NAME"
          if [[ "$RID" == win-* ]]; then
            cp out/creds.exe "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            cp out/creds "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      # A checksum beside each archive, written by the job that BUILT it.
      #
      # Per-asset rather than one SHA256SUMS, deliberately: the four builds run on four
      # runners with no barrier between them, and a single combined file would need a fifth
      # job whose only purpose is to collect them — a step that can fail on its own and leave
      # a release with binaries and no sums. Four small files have no such failure mode.
      #
      # This matters more here than for most tools: `creds` is installed on remote hosts by a
      # one-line command, and a download nobody can verify is a download that has to be
      # trusted because it arrived over TLS — which says the bytes were not altered in
      # transit, and nothing at all about which bytes they are.
      - name: Checksum
        shell: bash
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.rid }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  # Same shape as server-release, and here for the same reason: the defect was at all three sites,
  # so the fix is at all three. Fixing only the one that was noticed is the failure
  # .claude/rules/shared/common/security.md calls "a measure applied at SOME of its sites".
  cli-release:
    name: publish cli release
    needs: cli-binaries
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: assets
          merge-multiple: true

      - name: Create the release with every asset at once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Upload onto release-please's DRAFT, never create — see the server job's header.
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          # Appended once, however often this runs — see the server leg.
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          LINE="Native AOT builds of the headless CLI."
          case "$BODY" in
            *"$LINE"*) printf '%s\n' "$BODY" > notes.md ;;
            *)         { printf '%s' "$BODY"; printf '\n\n%s\n' "$LINE"; } > notes.md ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --title "creds ${GITHUB_REF_NAME#cli-v}" --notes-file notes.md

      - name: Every target has an asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RIDS: linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64 osx-x64
        shell: bash
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          MISSING=""
          for rid in $EXPECTED_RIDS; do
            case "$NAMES" in *"$rid"*) ;; *) MISSING="$MISSING $rid" ;; esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the release is missing an asset for:$MISSING"
            exit 1
          fi
          echo "all six RIDs present: $NAMES"

      # Only now downloadable — see the server job. A failure above leaves a draft, not a lie.
      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # The MCP server: same technology, same four RIDs, its own tag line. Versioned apart from the
  # CLI because they are two binaries with two audiences — a person installs `creds` for their
  # terminal and `creds-mcp` for their agent, and neither release should move the other.
  mcp-binaries:
    name: creds-mcp (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/mcp-v') || inputs.target == 'mcp'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # macOS needs no toolchain step: Native AOT uses the Xcode command line tools the
          # runners already carry. It cannot be cross-compiled, which is why each of these is
          # its OWN runner rather than another `-r` on an existing one.
          - rid: osx-arm64
            runner: macos-latest
          # osx-x64 built on the arm64 image, cross-targeted. It used to say `macos-13`, the last
          # Intel image, and that is why every server release ever made is missing this one asset:
          # the leg did not fail, it QUEUED — for 45 minutes on the tag that finally got looked at,
          # and presumably forever on the ones before. A job waiting for a runner that is not coming
          # is invisible in every list that shows conclusions.
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The shared library first, then this binary's own. The library's tests are what stop the
      # two implementations of the wire contract drifting, and this binary is now one of them.
      - name: Test
        run: |
          dotnet build src_broker_client/tests/BrokerClient.Tests.csproj -c Release
          ./src_broker_client/tests/bin/Release/net10.0/CredsBroker.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          dotnet build src_mcp/tests/CredsMcp.Tests.csproj -c Release
          ./src_mcp/tests/bin/Release/net10.0/CredsMcp.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash

      - name: Publish
        run: dotnet publish src_mcp/src/CredsMcp.csproj -c Release -r ${{ matrix.rid }} -o out

      # A binary that cannot answer --help did not really build; AOT failures often surface only
      # at first run, and this one carries a package the others do not. Skipped when
      # cross-architecture, where the runner cannot execute it.
      - name: Smoke
        if: ${{ !endsWith(matrix.rid, 'arm64') }}
        shell: bash
        run: ./out/creds-mcp${{ runner.os == 'Windows' && '.exe' || '' }} --help | grep -q 'creds_list'

      - name: Package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          VERSION="${GITHUB_REF_NAME#mcp-v}"
          NAME="creds-mcp-$VERSION-$RID"
          mkdir "$NAME"
          if [[ "$RID" == win-* ]]; then
            cp out/creds-mcp.exe "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            cp out/creds-mcp "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      # The same reason the CLI publishes one, and one more: this binary is installed by a button
      # inside the extension, which verifies what it downloads. A release that publishes no
      # checksum makes that verification a warning instead of a check.
      - name: Checksum
        shell: bash
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-${{ matrix.rid }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  mcp-release:
    name: publish mcp release
    needs: mcp-binaries
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcp-*
          path: assets
          merge-multiple: true

      - name: Create the release with every asset at once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Upload onto release-please's DRAFT, never create — see the server job's header.
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          # Appended once, however often this runs — see the server leg.
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          LINE="Native AOT builds of the MCP server."
          case "$BODY" in
            *"$LINE"*) printf '%s\n' "$BODY" > notes.md ;;
            *)         { printf '%s' "$BODY"; printf '\n\n%s\n' "$LINE"; } > notes.md ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --title "creds-mcp ${GITHUB_REF_NAME#mcp-v}" --notes-file notes.md

      - name: Every target has an asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RIDS: linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64 osx-x64
        shell: bash
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          MISSING=""
          for rid in $EXPECTED_RIDS; do
            case "$NAMES" in *"$rid"*) ;; *) MISSING="$MISSING $rid" ;; esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the release is missing an asset for:$MISSING"
            exit 1
          fi
          echo "all six RIDs present: $NAMES"

      # Only now downloadable — see the server job. A failure above leaves a draft, not a lie.
      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  extension:
    name: publish extension
    if: startsWith(github.ref, 'refs/tags/extension-v') || inputs.target == 'extension'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .vsix to a GitHub release
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - run: npm ci

      # Never publish something that has not passed its own tests.
      - run: npm run typecheck
      - run: npm test

      - name: Refuse to publish with a placeholder publisher
        run: |
          publisher=$(node -p "require('./package.json').publisher")
          if [ "$publisher" = "set-your-publisher-id" ]; then
            echo "package.json still carries the placeholder publisher id."
            echo "Create a publisher at https://marketplace.visualstudio.com/manage,"
            echo "put its id in package.json, and see docs/PUBLISHING.md."
            exit 1
          fi

      # The tag is what a human typed; package.json is what actually gets published.
      # When they disagree the Marketplace quietly takes the manifest's version, so
      # `extension-v0.34.0` can publish 0.33.0 and the tag becomes a lie nobody sees.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          tagged="${GITHUB_REF_NAME#extension-v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$manifest" ]; then
            echo "Tag says $tagged, package.json says $manifest."
            echo "Bump the manifest and move the tag, or tag the version that is in it."
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
        id: version

      # Package ONCE and publish that exact file. Publishing and packaging separately
      # builds the archive twice, and only one of the two was ever the one released.
      - name: Package
        run: npx vsce package --out creds-for-devs.vsix

      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT secret is not set — see docs/PUBLISHING.md."
            exit 1
          fi
          npx vsce publish --packagePath creds-for-devs.vsix --pat "${VSCE_PAT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: src_vs_code/creds-for-devs.vsix

      # Its own CHANGELOG section, so the release page says what changed instead of
      # repeating the tag. Falls back to a link rather than failing the release.
      - name: Release notes from the CHANGELOG
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          node -e "
            const fs = require('node:fs');
            const v = require('./package.json').version;
            const text = fs.readFileSync('CHANGELOG.md', 'utf8');
            const start = text.indexOf('## [' + v + ']');
            const body = start === -1
              ? 'See CHANGELOG.md.'
              : text.slice(start, (text.indexOf(String.fromCharCode(10) + '## [', start + 1) + 1) || text.length).trim();
            fs.writeFileSync('RELEASE_NOTES.md', body);
          "

      - name: GitHub release with the .vsix attached
        if: startsWith(github.ref, 'refs/tags/extension-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload onto release-please's DRAFT, never create — see the server job's header.
          #
          # The NOTES are the one place this leg differs from the other three: it keeps its own
          # RELEASE_NOTES.md, extracted from the hand-written CHANGELOG.md, and does NOT append
          # release-please's generated list. A paragraph of prose written by a person is better
          # release notes than a list of commit subjects, and protecting exactly that prose is why
          # release-please writes to RELEASES.md here instead.
          gh release upload "$GITHUB_REF_NAME" creds-for-devs.vsix --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --title "CredsForDevs ${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false
